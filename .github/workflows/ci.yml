name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Remap local cargo paths so artifact digests match manifest pins on
      # any machine — the same export lives in tooling/build.sh.
      - run: |
          export RUSTFLAGS="--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          cargo build --target wasm32-unknown-unknown --release -p auqw-youtube-music -p auqw-itunes -p auqw-deezer
      - name: validate artifact
        run: |
          mkdir -p plugins/youtube-music/dist
          cp target/wasm32-unknown-unknown/release/auqw_youtube_music.wasm \
             plugins/youtube-music/dist/youtube-music.wasm
          cargo run -q -p auqw-validate -- \
            plugins/youtube-music/dist/youtube-music.wasm \
            plugins/youtube-music/manifest.json
          mkdir -p plugins/itunes/dist
          cp target/wasm32-unknown-unknown/release/auqw_itunes.wasm \
             plugins/itunes/dist/itunes.wasm
          cargo run -q -p auqw-validate -- \
            plugins/itunes/dist/itunes.wasm \
            plugins/itunes/manifest.json
          mkdir -p plugins/deezer/dist
          cp target/wasm32-unknown-unknown/release/auqw_deezer.wasm \
             plugins/deezer/dist/deezer.wasm
          cargo run -q -p auqw-validate -- \
            plugins/deezer/dist/deezer.wasm \
            plugins/deezer/manifest.json
