name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vendor-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Vehicoule/Auqw
          path: auqw
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: node tooling/vendor-check.mjs --sdk ../auqw/sdk/rust --check

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: node --test tooling/sign.test.mjs
      - run: node tooling/feed.mjs --check
      # Remap local cargo and toolchain/sysroot paths so artifact digests
      # match manifest pins on any machine — the same export lives in
      # tooling/build.sh. Build each plugin in its own cargo invocation:
      # a single multi-package build unifies features across plugins
      # (e.g. serde/derive enabled by one guest changes siblings' bytes),
      # so only per-plugin builds reproduce the pinned digests.
      - run: |
          export RUSTFLAGS="--remap-path-prefix=$(rustc --print sysroot)/lib/rustlib/src/rust=/rustc/$(rustc -vV | awk '/commit-hash/{print $2}') --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=$(rustc --print sysroot)=/sysroot"
          for crate in auqw-youtube-music auqw-itunes auqw-deezer auqw-lyrics-lrclib; do
            cargo build --locked --target wasm32-unknown-unknown --release -p "$crate"
          done
      - name: validate artifact
        run: |
          mkdir -p plugins/youtube-music/dist
          cp target/wasm32-unknown-unknown/release/auqw_youtube_music.wasm \
             plugins/youtube-music/dist/youtube-music.wasm
          cargo run -q --locked -p auqw-validate -- \
            plugins/youtube-music/dist/youtube-music.wasm \
            plugins/youtube-music/manifest.json
          mkdir -p plugins/itunes/dist
          cp target/wasm32-unknown-unknown/release/auqw_itunes.wasm \
             plugins/itunes/dist/itunes.wasm
          cargo run -q --locked -p auqw-validate -- \
            plugins/itunes/dist/itunes.wasm \
            plugins/itunes/manifest.json
          mkdir -p plugins/deezer/dist
          cp target/wasm32-unknown-unknown/release/auqw_deezer.wasm \
             plugins/deezer/dist/deezer.wasm
          cargo run -q --locked -p auqw-validate -- \
            plugins/deezer/dist/deezer.wasm \
            plugins/deezer/manifest.json
          mkdir -p plugins/lyrics-lrclib/dist
          cp target/wasm32-unknown-unknown/release/auqw_lyrics_lrclib.wasm \
             plugins/lyrics-lrclib/dist/lyrics-lrclib.wasm
          cargo run -q --locked -p auqw-validate -- \
            plugins/lyrics-lrclib/dist/lyrics-lrclib.wasm \
            plugins/lyrics-lrclib/manifest.json
